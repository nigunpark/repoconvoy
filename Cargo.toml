[package]
name = "repoconvoy"
version = "0.1.0"
edition = "2024"
description = "Local multi-repository coding-agent orchestration workbench"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nigunpark/repoconvoy"
publish = false

[dependencies]
axum = "0.8.9"
redb = "4.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
