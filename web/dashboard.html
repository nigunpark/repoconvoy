<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepoConvoy · Control</title>
<style>
:root{color-scheme:dark;--bg:#101318;--panel:#171c23;--panel2:#1c222b;--line:#303944;--ink:#e7ecf0;--muted:#99a6b2;--accent:#80d9be;--amber:#e5bd72;--danger:#e7a19b;font:14px/1.5 "Segoe UI Variable","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 24px;border-bottom:1px solid var(--line);background:#141920}.brand{font-weight:700;font-size:16px;letter-spacing:-.04em;display:flex;align-items:center;gap:12px}.mark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:5px;background:var(--accent);color:#0d1917;font-weight:800}.topmeta{font:12px Consolas,monospace;color:var(--muted);white-space:nowrap}.status{color:var(--amber);border:1px solid #776047;border-radius:4px;padding:5px 9px}
.shell{height:calc(100vh - 58px);display:grid;grid-template-columns:260px minmax(500px,1fr);min-height:560px}.rail{border-right:1px solid var(--line);background:#151a21;display:flex;flex-direction:column;min-width:0}.rail h2,.board h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0}.railhead{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px}.iconbtn{border:1px solid var(--line);background:transparent;color:var(--ink);width:30px;height:30px;border-radius:5px;font-size:19px;line-height:1}.project-list{padding:0 10px;overflow:auto;flex:1}.project-list button{border:0;border-radius:5px;background:transparent;color:var(--muted);padding:11px 12px;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}.project-list button:hover{background:#202832;color:var(--ink)}.project-list button.active{background:#263630;color:var(--ink);box-shadow:inset 2px 0 var(--accent)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{font:11px Consolas,monospace;color:var(--muted)}.railfoot{border-top:1px solid var(--line);padding:16px 18px;color:var(--muted);font-size:12px}
.content{min-width:0;overflow:auto;display:flex;flex-direction:column}.heading{padding:26px 30px 22px;border-bottom:1px solid var(--line)}.crumb{color:var(--muted);font:11px Consolas,monospace;letter-spacing:.05em}.heading h1{font-size:27px;font-weight:650;letter-spacing:-.045em;margin:7px 0 3px}.sub{color:var(--muted);margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:18px}.btn{background:var(--accent);color:#10221c;border:1px solid var(--accent);border-radius:5px;padding:8px 13px;font-weight:650}.btn.secondary{color:var(--ink);background:transparent;border-color:var(--line)}.btn:hover:not(:disabled){filter:brightness(1.08)}
.workspace{padding:24px 30px;display:grid;grid-template-columns:minmax(220px,280px) minmax(360px,1fr);gap:24px;min-height:0;flex:1}.sidepanel,.board{min-width:0}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.session-list{display:grid;gap:7px}.session{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);text-align:left;padding:14px}.session.active{border-color:#5aa78f;background:#1d2a29}.session .id{font:12px Consolas,monospace}.session .state{display:block;margin-top:4px;font-size:12px;color:var(--muted)}.empty{border:1px dashed #414a55;border-radius:6px;padding:26px;color:var(--muted);background:#171c23;line-height:1.65}.empty strong{display:block;color:var(--ink);font-weight:550;margin-bottom:5px}.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.board-scope{font:11px Consolas,monospace;color:var(--muted)}.board-grid{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:9px}.lane{min-height:200px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px}.lane h3{margin:0 0 12px;font-size:12px;color:var(--muted);font-weight:600}.lane .lane-empty{color:#737f8b;font-size:12px;border-top:1px solid var(--line);padding-top:12px}.order{margin-top:20px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:16px}.order h3{font-size:13px;margin:0 0 9px}.order textarea,.newproject input,.newproject textarea{width:100%;background:#0f1419;border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:10px 12px;resize:vertical}.order textarea{min-height:82px}.orderfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.hint{font-size:12px;color:var(--muted)}.notice{color:var(--danger);min-height:19px;font-size:12px;margin:10px 0 0}.newproject{border:1px solid var(--line);background:var(--panel);padding:16px;margin:0 10px 12px;border-radius:6px}.newproject label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.newproject textarea{min-height:76px}.newproject .btn{margin-top:10px}.hidden{display:none}
.child{border:1px solid var(--line);border-radius:5px;padding:10px;margin:8px 0;background:var(--panel2);display:grid;gap:3px}.child strong{font-size:12px;overflow:hidden;text-overflow:ellipsis}.child small{color:var(--muted);font:11px Consolas,monospace;overflow:hidden;text-overflow:ellipsis}.child[data-state=failed]{border-color:#a36a67}.child[data-state=running]{border-color:#598879}
[hidden]{display:none!important}.iconbtn{width:auto;min-width:44px;min-height:44px;padding:0 12px;font-size:12px;font-weight:600}.setup-state{min-height:230px;display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line);padding:28px 12px 30px}.setup-state strong{font-size:18px;letter-spacing:-.025em;font-weight:600}.setup-state p{color:var(--muted);line-height:1.75;max-width:56ch;margin:8px 0 0}.project-repos{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:13px}.project-repos .repo-chip{border:1px solid var(--line);border-radius:3px;padding:3px 7px;color:var(--muted);font:11px Consolas,monospace}
@media(max-width:990px){.shell{grid-template-columns:210px 1fr}.workspace{grid-template-columns:1fr}.board-grid{grid-template-columns:repeat(3,minmax(100px,1fr))}}@media(max-width:680px){.shell{display:block}.rail{height:auto;border-right:0;border-bottom:1px solid var(--line)}.project-list{max-height:120px}.railfoot{display:none}.heading,.workspace{padding:17px}.board-grid{grid-template-columns:1fr}.lane{min-height:80px}.topmeta{display:none}}
</style><link rel="stylesheet" href="/theme.css"><script src="/theme.js" defer></script></head><body class="dashboard">
<header class="top"><div class="brand"><img class="mark" src="/assets/app-icon.svg" alt="">RepoConvoy</div><button id="theme-toggle" class="theme-toggle" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#sun"></use></svg><span class="theme-label">화이트 모드</span></button><div class="topmeta status" id="dispatch-status">확인 중</div></header>
<div class="shell"><aside class="rail"><div class="railhead"><h2 class="icon-heading"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#folder-git-2"></use></svg>프로젝트</h2><button class="iconbtn" id="add-project" aria-label="프로젝트 추가" aria-expanded="false" title="프로젝트 추가"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#plus"></use></svg>프로젝트 추가</button></div><form id="newproject" class="newproject hidden"><strong>프로젝트 등록</strong><label for="project-name">이름</label><input id="project-name" required maxlength="80" placeholder="예: Portfolio 2027"><label for="repo-paths">Git 저장소 루트 경로 · 한 줄에 하나</label><textarea id="repo-paths" required placeholder="C:/path/to/repository"></textarea><button class="btn" type="submit">로컬에 등록</button><button id="cancel-project" type="button" class="btn secondary">취소</button><p id="project-error" class="notice" role="alert"></p></form><nav id="projects" class="project-list" aria-label="등록된 프로젝트"></nav></aside>
<main class="content"><section class="heading"><div class="row"><h1 id="project-title">프로젝트가 없습니다</h1><button id="new-session" class="btn secondary" disabled><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#plus"></use></svg>메인 세션 만들기</button></div></section>
<section class="workspace"><aside class="sidepanel"><div class="panel-title"><h2 class="icon-heading"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#git-branch"></use></svg>저장소</h2></div><div id="project-repos" class="project-repos" aria-label="등록된 저장소" hidden></div><div class="panel-title"><h2 class="icon-heading"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#square-terminal"></use></svg>메인 세션</h2><span id="session-count" class="count">0</span></div><div id="sessions" class="session-list"></div></aside>
<section class="board"><div class="board-head"><h2 class="icon-heading"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#layout-dashboard"></use></svg>저장소별 작업 현황</h2><span class="board-scope" id="board-scope">세션 미선택</span></div><div id="setup-state" class="setup-state" role="status"><strong>프로젝트 추가</strong></div><div id="board-grid" class="board-grid" hidden><div class="lane"><h3>대기</h3><div class="lane-empty">실제 배차 기록 없음</div></div><div class="lane"><h3>실행 / 검증</h3><div class="lane-empty">실제 작업자 없음</div></div><div class="lane"><h3>리뷰 준비</h3><div class="lane-empty">검증된 후보 없음</div></div></div><div id="order-box" class="order" hidden><h3>이 세션에 오더 보내기</h3><textarea id="order-prompt" placeholder="프로젝트 전체 목표를 입력하세요" disabled></textarea><div class="orderfoot"><span id="order-hint" class="hint">작업자 연결 확인 중</span><button id="send-order" class="btn" disabled>오더 보내기</button></div></div><p id="notice" class="notice" role="status"></p></section></section></main></div>
<script>
const $=id=>document.getElementById(id);let projects=[],selected=null,session=null,capabilities={dispatch:false},sessionsEpoch=0;
function text(tag,value,className){const node=document.createElement(tag);node.textContent=value;if(className)node.className=className;return node;}
function notice(message){$('notice').textContent=message;}
function projectError(message){if(/Git root/.test(message))return 'Git 저장소의 최상위 폴더를 선택해 주세요.';if(/already registered|duplicated/.test(message))return '이미 등록된 프로젝트 또는 저장소입니다.';if(/Expected project name/.test(message))return '프로젝트 이름과 저장소 경로를 확인해 주세요.';return '프로젝트 등록에 실패했습니다. 입력을 확인해 주세요.';}
async function api(path,method='GET',body){const response=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const value=await response.json();if(!response.ok)throw new Error(value.error||'요청 실패');return value;}
function updateOrderControls(){const allowed=capabilities.dispatch&&session?.state==='idle';$('order-box').hidden=!allowed;$('order-prompt').disabled=!allowed;$('send-order').disabled=!allowed;$('order-hint').textContent='검증 완료 전에는 Review PR을 열 수 없습니다.';}
function drawProjects(){const list=$('projects');list.replaceChildren();for(const project of projects){const button=document.createElement('button');button.type='button';button.className=project.id===selected?.id?'active':'';button.append(text('span',project.name,'name'),text('span',`저장소 ${project.repositories.length}개`,'count'));button.onclick=()=>pickProject(project);list.append(button);}}
async function pickProject(project){selected=project;session=null;sessionsEpoch++;notice('');drawProjects();$('project-title').textContent=project.name;$('new-session').disabled=false;const names=$('project-repos');names.replaceChildren();names.hidden=false;for(const repo of project.repositories){const chip=text('span',repo.name,'repo-chip');chip.title=repo.path;names.append(chip);}$('sessions').replaceChildren();$('session-count').textContent='0';drawBoard();updateOrderControls();try{await refreshSessions(project.id);}catch(error){if(selected?.id===project.id)notice(error.message);}}
function sessionStatus(item){if(item.state==='idle')return'오더 대기';if(item.children.some(child=>child.state==='failed'))return'실패 · 확인 필요';if(item.children.length&&item.children.every(child=>child.state==='analysis_done'))return'분석 종료 · 검증 전';return item.state==='running'?'작업 중':item.state;}
async function refreshSessions(projectId=selected?.id){if(!projectId)return;const epoch=++sessionsEpoch;const value=await api(`/api/projects/${projectId}/sessions`);if(selected?.id!==projectId||epoch!==sessionsEpoch)return;const list=$('sessions');list.replaceChildren();$('session-count').textContent=String(value.sessions.length);if(!value.sessions.length){list.append(text('div','세션 없음','empty'));return;}value.sessions.forEach((item,index)=>{const button=document.createElement('button');button.type='button';button.className=`session ${item.id===session?.id?'active':''}`;button.title=`세션 ID ${item.id}`;button.append(text('span',`메인 세션 ${index+1}`,'id'),text('span',`${sessionStatus(item)} · 자식 세션 ${item.children.length}개`,'state'));if(item.order?.prompt)button.append(text('span',item.order.prompt,'state'));button.onclick=()=>pickSession(item);list.append(button);});}
function drawBoard(){const lanes=[...document.querySelectorAll('#board-grid .lane')];for(const lane of lanes){lane.querySelectorAll('.child').forEach(x=>x.remove());lane.querySelector('.lane-empty').hidden=false;}const setup=$('setup-state').querySelector('strong');if(!session){$('board-scope').textContent='';$('board-grid').hidden=true;$('setup-state').hidden=false;setup.textContent=selected?'메인 세션 만들기':'프로젝트 추가';return;}$('board-scope').textContent=`${session.id.slice(0,8)} · 자식 ${session.children.length}개`;$('board-grid').hidden=!session.children.length;$('setup-state').hidden=!!session.children.length;if(!session.children.length)setup.textContent=capabilities.dispatch?'오더 입력':'자동 배차 엔진 미연결';for(const child of session.children){const index=child.state==='queued'?0:child.state==='review_ready'?2:1;const lane=lanes[index];lane.querySelector('.lane-empty').hidden=true;const card=document.createElement('div');card.className='child';card.dataset.state=child.state;const status={queued:'배차 대기',running:'실행 중',analysis_done:'분석 종료 · 제품 검증 전',failed:'실패',interrupted:'중단',verifying:'검증 중',review_ready:'리뷰 준비'}[child.state]||child.state;card.append(text('strong',child.repositoryName),text('small',`자식 ${child.id.slice(0,8)} · ${status}`),text('small',child.providerSessionId?`제공자 세션 ${child.providerSessionId.slice(0,24)}`:'제공자 세션 시작 전'));lane.append(card);}}
async function syncBoard(id,projectId=selected?.id){if(!projectId)return;try{const state=await api(`/api/sessions/${id}/board`);if(session?.id!==id||selected?.id!==projectId||state.projectId!==projectId)return;session={...session,state:state.state,children:state.children};drawBoard();updateOrderControls();await refreshSessions(projectId);}catch(error){if(session?.id===id&&selected?.id===projectId)notice(error.message);}}
async function pickSession(item){const projectId=selected?.id;if(!projectId||item.projectId!==projectId)return;session=item;drawBoard();updateOrderControls();await refreshSessions(projectId);if(selected?.id!==projectId||session?.id!==item.id)return;await syncBoard(item.id,projectId);}
function closeProjectForm(){$('newproject').classList.add('hidden');$('add-project').setAttribute('aria-expanded','false');$('project-error').textContent='';$('add-project').focus();}
$('add-project').onclick=()=>{const form=$('newproject');form.classList.toggle('hidden');$('add-project').setAttribute('aria-expanded',String(!form.classList.contains('hidden')));if(!form.classList.contains('hidden'))$('project-name').focus();};
$('cancel-project').onclick=closeProjectForm;
$('newproject').onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();closeProjectForm();}};
$('newproject').onsubmit=async event=>{event.preventDefault();$('project-error').textContent='';try{const project=await api('/api/projects','POST',{name:$('project-name').value,repositoryPaths:$('repo-paths').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)});projects.push(project);$('newproject').reset();closeProjectForm();await pickProject(project);}catch(error){$('project-error').textContent=projectError(error.message);}};
$('new-session').onclick=async()=>{if(!selected)return;const projectId=selected.id;try{const item=await api(`/api/projects/${projectId}/sessions`,'POST',{});if(selected?.id!==projectId||item.projectId!==projectId)return;await pickSession(item);}catch(error){if(selected?.id===projectId)notice(error.message);}};
$('send-order').onclick=async()=>{if(!session||!capabilities.dispatch)return;const id=session.id,projectId=selected?.id;try{const value=await api(`/api/sessions/${id}/orders`,'POST',{prompt:$('order-prompt').value});if(session?.id!==id||selected?.id!==projectId||value.projectId!==projectId)return;session=value;$('order-prompt').value='';notice('오더 접수 · 등록된 자식 세션의 실제 상태를 표시합니다.');drawBoard();updateOrderControls();await refreshSessions(projectId);}catch(error){if(session?.id===id&&selected?.id===projectId)notice(error.message);}};
Promise.all([api('/api/projects'),api('/api/capabilities')]).then(([list,cap])=>{projects=list.projects;capabilities=cap;$('dispatch-status').textContent=cap.dispatch?'분석 어댑터 연결':'엔진 미연결';drawProjects();updateOrderControls();if(projects.length)pickProject(projects[0]);}).catch(error=>notice(error.message));
setInterval(()=>{if(session)syncBoard(session.id);},1500);
</script></body></html>
