name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
          - os: windows-2022
            toolchain: stable-x86_64-pc-windows-gnullvm
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust components
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt,clippy
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            rustup component add rust-mingw --toolchain "${{ matrix.toolchain }}"
          fi
      - name: Add Windows Rust runtime DLL to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sysroot = rustc --print sysroot
          "$sysroot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Format, lint, test
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  ui:
    name: UI race / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test project switching
        run: npm run test:ui
